<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#1976d2">
<link rel="manifest" href="manifest.json">
<title>Chronomètre</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#1976d2,#0d47a1);
    font-family:Arial,sans-serif;
}

.container{
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
    text-align:center;
}

#chrono{
    font-size:70px;
    font-family:"Courier New",monospace;
    font-weight:bold;
    color:#1976d2;
    margin:30px 0;
    letter-spacing:3px;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

button{
    border:none;
    border-radius:10px;
    padding:15px 25px;
    margin:10px;
    font-size:18px;
    cursor:pointer;
    color:white;
    transition:.25s;
}

button:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 20px rgba(0,0,0,.25);
}

button:active{
    transform:scale(.97);
}

.start{
    background:#43a047;
}

.stop{
    background:#e53935;
}

.reset{
    background:#fb8c00;
}

#chrono{
    transition:.2s;
}

.running{
    color:#2e7d32;
    transform:scale(1.08);
    text-shadow:0 0 15px rgba(46,125,50,.5);
}
</style>

</head>

<body>
    <div class="container">

        <h1>Chronomètre</h1>

        <div id="chrono">00:00.00</div>

        <div class="buttons">
            <button class="reset" onclick="reset()">Remise à zéro</button>
            <button class="start" onclick="depart()">Départ</button>
            <button class="stop" onclick="arret()">Arrêt</button>
        </div>
    </div>

<script>

let debut = 0;
let timer = null;

function depart(){

    if(timer) return;

    document.getElementById("chrono").classList.add("running");

    let affichage = document.getElementById("chrono").innerText.split(":");

    let tempsActuel = 0;

    if(affichage.length === 2){
        let minutes = parseInt(affichage[0]);
        let secondes = parseFloat(affichage[1]);
        tempsActuel = minutes * 60 + secondes;
    }

    debut = performance.now() - tempsActuel * 1000;

    timer = setInterval(function(){

        let t = (performance.now() - debut) / 1000;

        let minutes = Math.floor(t / 60);
        let secondes = Math.floor(t % 60);
        let centiemes = Math.floor((t - Math.floor(t)) * 100);

        document.getElementById("chrono").innerText =
            String(minutes).padStart(2, "0") + ":" +
            String(secondes).padStart(2, "0") + "." +
            String(centiemes).padStart(2, "0");

    }, 10);
}

function arret(){

    document.getElementById("chrono").classList.remove("running");
    clearInterval(timer);
    timer = null;

}

function reset(){

    clearInterval(timer);
    timer = null;

    document.getElementById("chrono").classList.remove("running");

    document.getElementById("chrono").innerText = "00:00.00";

}

</script>

<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js')
        .then(() => console.log("Service Worker installé"))
        .catch(err => console.log(err));
}
</script>

</body>
</html>
