<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#1976d2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Chronomètre" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" href="icon-512.png" type="image/png" />
    <link rel="apple-touch-icon" href="icon-192.png" />

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module" src="js/script.js"></script>

    <title>Chronomètre 3D</title>
  </head>

  <body>
    <div id="ui">
      <div class="card">
        <button id="openChrono">⏱️ Chrono</button>

        <button id="openTimer">⏲️ Timer</button>

        <button id="openHistory">📜 History</button>
      </div>
    </div>

    <div id="chronoMenu">
      <button data-activity="course">Course</button>
      <button data-activity="travail">Travail</button>
      <button data-activity="lecture">Lecture</button>
      <button data-activity="sport">Sport</button>
      <button data-activity="autre">Autre</button>

      <hr>

      <button data-activity="">❌ Ne pas enregistrer</button>
    </div>

    <div id="timerPanel">
      <div class="timer-header">
        <h2>Timer</h2>

        <button id="closeTimer">✕</button>
      </div>

      <label>
        Durée :
        <input
          type="number"
          id="timerMinutes"
          value="0"
          min="0"
        /> min
      </label>

      <label>
        Secondes :
        <input
          type="number"
          id="timerSeconds"
          value="0"
          min="0"
          max="59"
        />
      </label>

      <button id="timerAction">Démarrer</button>

      <div id="timerDisplay">00:00</div>
    </div>

    <div id="history">
      <div class="history-header">
        <h2>Historique</h2>

        <button id="closeHistory">✕</button>
      </div>

      <div class="history-filter">
        <label for="filtreActivite">Filtrer :</label>

        <select id="filtreActivite">
          <option value="">Toutes les activités</option>
          <option value="Course">Course</option>
          <option value="Travail">Travail</option>
          <option value="Lecture">Lecture</option>
          <option value="Sport">Sport</option>
          <option value="Autre">Autre</option>
        </select>
      </div>

      <div id="historyContent"></div>
    </div>

    <div id="historyMenu">
      <button data-activity="">Toutes les activités</button>
      <button data-activity="course">Course</button>
      <button data-activity="travail">Travail</button>
      <button data-activity="lecture">Lecture</button>
      <button data-activity="sport">Sport</button>
      <button data-activity="autre">Autre</button>
    </div>

    <div id="scene"></div>
    <!-- <div id="chrono">00:00.00</div> -->
  </body>
</html>
